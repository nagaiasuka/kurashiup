name: Deploy theme to XREA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: xrea-theme-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wp-content/themes/kurashiup-theme/package-lock.json

      - name: Install and build
        working-directory: wp-content/themes/kurashiup-theme
        run: |
          npm ci
          npm run build

      - name: Install lftp
        run: bash scripts/install-deploy-tools.sh

      - name: Package approved guide release
        run: |
          python3 scripts/package-guide-release.py
          python3 scripts/package-guide-updates.py

      - name: Deploy theme by FTPS
        env:
          XREA_HOST: ${{ secrets.XREA_HOST }}
          XREA_USER: ${{ secrets.XREA_USER }}
          XREA_PASSWORD: ${{ secrets.XREA_PASSWORD }}
        run: |
          lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          open -u "${XREA_USER}","${XREA_PASSWORD}" "${XREA_HOST}"
          mkdir -p /public_html/amocreo.com/wp-content/themes/kurashiup-theme
          mirror --reverse --delete --verbose \
            --exclude node_modules/ \
            --exclude src/ \
            --exclude package.json \
            --exclude package-lock.json \
            --exclude vite.config.js \
            wp-content/themes/kurashiup-theme/ \
            /public_html/amocreo.com/wp-content/themes/kurashiup-theme/
          bye
          EOF

      - name: Verify deployed guide revisions
        run: |
          shopt -s nullglob
          for manifest in wp-content/themes/kurashiup-theme/releases/guide-updates/*/manifest.json; do
            slug="$(basename "$(dirname "$manifest")")"
            expected="$(sha256sum "$manifest" | cut -d ' ' -f 1)"
            applied=
            for attempt in 1 2 3; do
              headers="$(curl --fail --silent --show-error --location --max-time 30 \
                --output /dev/null --dump-header - "https://amocreo.com/guide/${slug}/?guide_deploy=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}")" || continue
              applied="$(awk 'tolower($1) == "x-kurashiup-guide-revision:" {gsub(/\r/, "", $2); print $2}' <<< "$headers")"
              if [[ "$applied" == "$expected" ]]; then
                break
              fi
              sleep 5
            done
            if [[ "$applied" != "$expected" ]]; then
              echo "Guide revision was not confirmed: $slug" >&2
              exit 1
            fi
          done
